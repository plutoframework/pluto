name: Pluto PR review
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows:
      - "Check ecosystem README examples"
      - "Test PR automation"
      - "Pluto security"
      - "Notify PR review"
      - "CodeQL"
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to reevaluate
        required: true
        type: string
      retry_review:
        description: Run the model again for this revision (uses review tokens)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  resolve:
    name: Resolve current review targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      has_targets: ${{ steps.targets.outputs.has_targets }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: plutoframework/pluto
          ref: 56d2383223c433b6683e68e8cd9a86c2017ef478
          path: policy
          persist-credentials: false
      - name: Resolve current pull requests
        id: targets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 policy/scripts/pr_automation/resolve.py
  review:
    needs: resolve
    if: needs.resolve.outputs.has_targets == 'true'
    name: Review and enforce merge policy
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    concurrency:
      group: >-
        pluto-review-${{ github.repository }}-${{ matrix.number }}-${{
          matrix.head }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pluto-review
    steps:
      - name: Create repository-scoped bot token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.PLUTO_REVIEW_APP_ID }}
          private-key: ${{ secrets.PLUTO_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: plutoframework/pluto
          ref: 56d2383223c433b6683e68e8cd9a86c2017ef478
          path: policy
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: The-PR-Agent/pr-agent
          ref: 04b641aa3c8ddbff111eeafb8cf0e8ea1ab8df2c
          path: pr-agent
          persist-credentials: false
      - uses: astral-sh/setup-uv@4c58170a945e4e68ce3fc5b7af3d341d9b8c64ef
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Install locked reviewer dependencies
        working-directory: pr-agent
        run: uv sync --frozen --extra github --no-dev
      - name: Review current PR and evaluate policy
        env:
          GPUROUTER_API_KEY: ${{ secrets.GPUROUTER_API_KEY }}
          PR_REVIEWER__PUBLISH_ERROR_DETAILS: "true"
          CHECK_TOKEN: ${{ steps.app.outputs.token }}
          BOT_TOKEN: ${{ secrets.PLUTO_STEWARD_TOKEN }}
          REVIEW_TOKEN: ${{ secrets.PLUTO_STEWARD_TOKEN }}
          BOT_LOGIN: jackbot-advrsty
          PLUTO_REVIEW_APP_ID: ${{ vars.PLUTO_REVIEW_APP_ID }}
          TARGET_REPOSITORY: ${{ github.repository }}
          RESOLVED_PR_NUMBER: ${{ matrix.number }}
          RESOLVED_HEAD_SHA: ${{ matrix.head }}
          POLICY_SHA: 56d2383223c433b6683e68e8cd9a86c2017ef478
          PR_AGENT_SOURCE: ${{ github.workspace }}/pr-agent
          ENABLE_AUTO_MERGE: ${{ vars.PLUTO_AUTO_MERGE }}
        run: python3 policy/scripts/pr_automation/controller.py
